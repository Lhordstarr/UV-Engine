[project]
name = "videogen-backend"
version = "0.1.0"
description = "AI Video Generation Studio backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "python-multipart>=0.0.12",
  "aiofiles>=24.1.0",
  "pillow>=11.0.0",
  "numpy>=2.0.0",
  "psutil>=6.0.0",
]

[project.optional-dependencies]
ml = [
  "torch>=2.4.0",
  "diffusers>=0.31.0",
  "transformers>=4.46.0",
  "accelerate>=1.1.0",
  "safetensors>=0.4.5",
]
